name: Обновление базы

# Раз в неделю (и по кнопке) пересобирает game/data/hm27-data.json:
#  1) составы, звенья, травмы, статистика сезона, xG — из данных NHL-STATS.RU (Levastak/nhl-svodka);
#  2) расширенные характеристики — сводки сезонов MoneyPuck и трекинг NHL EDGE (data/extra.json.gz).
# Изменения коммитятся, затем запускается сборка игры.
on:
  schedule:
    - cron: "17 5 * * 1"   # понедельник, 08:17 по Москве
  workflow_dispatch:
    inputs:
      edge:
        description: "Собирать NHL EDGE (скорость, бросок)"
        type: boolean
        default: true

permissions:
  contents: write
  actions: write

jobs:
  data:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: Levastak/nhl-svodka
          path: svodka
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: База из «Сводки»
        run: python3 data/build.py svodka game/data/hm27-data.json
      - name: MoneyPuck и NHL EDGE
        run: |
          EDGE_FLAG=""
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.edge }}" = "false" ]; then EDGE_FLAG="--no-edge"; fi
          python3 data/fetch_extra.py --ids game/data/hm27-data.json --out data/extra.json.gz $EDGE_FLAG 2> fetch.log || { tail -40 fetch.log; exit 1; }
          tail -15 fetch.log
          echo "::notice title=extra::$(grep -E '^\{' fetch.log | tail -1 | head -c 1500)"
      - name: База с расширенными характеристиками
        run: |
          python3 data/build.py svodka game/data/hm27-data.json data/extra.json.gz | tee build.log
          echo "::notice title=build::$(tail -c 900 build.log | tr '\n' '|')"
      - name: Модель игрока (data/derived.json.gz → формат 3)
        run: python3 data/merge_model.py game/data/hm27-data.json data/derived.json.gz
      - name: Коммит, если база изменилась
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "hm27-bot"
          git config user.email "hm27-bot@users.noreply.github.com"
          git add game/data/hm27-data.json data/extra.json.gz
          [ -f data/edge_sample.json ] && git add data/edge_sample.json
          if git diff --cached --quiet; then echo "Без изменений"; exit 0; fi
          git commit -m "База: данные на $(python3 -c 'import json;print(json.load(open("game/data/hm27-data.json"))["data_date"])')"
          git push
          # коммит от GITHUB_TOKEN сам сборку не запускает — запускаем явно
          gh workflow run build.yml --ref main
